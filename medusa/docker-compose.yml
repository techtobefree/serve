services:
  medusa:
    image: medusajs/medusa:latest
    container_name: medusa
    restart: always
    depends_on:
      - redis
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=medusa
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${MEDUSA_API_KEY}
    ports:
      - "${MEDUSA_PORT}:9000"
    networks:
      - medusa_net
    volumes:
      - .:/app

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - medusa_net

networks:
  medusa_net:
    driver: bridge
